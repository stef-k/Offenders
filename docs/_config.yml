# Resolve shared presentation assets during the GitHub Pages build.
remote_theme: stef-k/.github@main

plugins:
  - jekyll-remote-theme

# Project identity and repository-scoped Pages URL.
title: Offenders
description: Fail2Ban investigation and diagnostics TUI.
url: https://stef-k.github.io
