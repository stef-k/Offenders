# Install the investigation TUI and its concrete modules together.
[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "offenders"
version = "0.3.1"
description = "A terminal investigation and diagnostics tool for Fail2Ban"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fail2ban", "tui", "terminal", "linux", "sysadmin", "diagnostics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = ["textual>=8.2.8,<9", "maxminddb>=3.1,<4", "dnspython>=2.8,<3", "ipwhois>=1.3,<2"]

# Public support and source locations; no maintainer-private contact details.
[project.urls]
Source = "https://github.com/stef-k/Offenders"
Issues = "https://github.com/stef-k/Offenders/issues"
PyPI = "https://pypi.org/project/offenders/"
Documentation = "https://stef-k.github.io/Offenders/"

[project.scripts]
offenders = "offenders:main"

[tool.setuptools]
# Include the explicit native nftables backend without introducing dependencies.
py-modules = ["offenders", "offenders_selection", "offenders_help", "offenders_help_content", "offenders_export", "offenders_export_cli", "offenders_export_ui", "offenders_activity", "offenders_host", "offenders_sources", "offenders_evidence", "offenders_patterns", "offenders_findings", "offenders_recommendations_ui", "offenders_validation", "offenders_validation_ui", "offenders_candidate", "offenders_candidate_ui", "offenders_coverage", "offenders_report", "offenders_filter", "offenders_aggregate", "offenders_summary_ui", "offenders_ip", "offenders_ip_ui", "offenders_lookup", "offenders_events", "offenders_fail2ban", "offenders_nftables", "offenders_geoip", "offenders_geoip_update", "offenders_geoip_cli", "offenders_geoip_ui", "offenders_jail_ui"]
