# Install the dashboard and its concrete report/status modules together.
[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "offenders"
version = "0.1.0"
description = "A Fail2Ban log and jail dashboard for the terminal"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["textual>=8.2.8,<9", "maxminddb>=3.1,<4"]

[project.scripts]
offenders = "offenders:main"

[tool.setuptools]
py-modules = ["offenders", "offenders_host", "offenders_report", "offenders_filter", "offenders_aggregate", "offenders_summary_ui", "offenders_ip", "offenders_ip_ui", "offenders_events", "offenders_fail2ban", "offenders_geoip", "offenders_geoip_update", "offenders_geoip_cli", "offenders_geoip_ui", "offenders_jail_ui"]
