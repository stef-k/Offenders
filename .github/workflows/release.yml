# Only a deliberately published release may reach the protected PyPI job.
name: Publish Python distribution
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_distribution.py --tag "$RELEASE_TAG" --tag-only
      - name: Test and build standard distributions
        run: |
          python -m pip install build twine
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py
      - name: Smoke the installed wheel outside the checkout
        run: |
          smoke=$(mktemp -d)
          python -m venv "$smoke/venv"
          "$smoke/venv/bin/python" -m pip install dist/*.whl
          cp tests/test_runtime.py "$smoke/"
          cd "$smoke"
          export XDG_DATA_HOME="$smoke/data"
          "$smoke/venv/bin/offenders" geoip status
          test ! -e "$XDG_DATA_HOME"
          "$smoke/venv/bin/python" -I -m unittest discover -s "$smoke" -p test_runtime.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    # OIDC is available only here; no source checkout or build runs in this job.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
